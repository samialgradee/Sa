<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة المستخدم</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>مرحبًا <span id="username"></span></h2>
        <textarea id="userData" placeholder="أدخل بياناتك هنا"></textarea>
        <button onclick="saveData()">حفظ</button>
        <button onclick="logout()">تسجيل الخروج</button>
    </div>

    <script>
        document.getElementById("username").innerText = localStorage.getItem("loggedUser") || "مستخدم مجهول";

        function saveData() {
            const data = document.getElementById("userData").value;
            localStorage.setItem("data_" + localStorage.getItem("loggedUser"), data);
            alert("تم حفظ البيانات!");
        }

        function logout() {
            localStorage.removeItem("loggedUser");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
